<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the dough video</title>
<meta name="description" content="The dough-kitchen video, embedded.">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥣</text></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { min-height: 100dvh; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    gap: 22px;
    padding: 40px 18px;
    background: radial-gradient(1200px 700px at 50% -10%, #1b1b22 0%, #0b0b0d 60%, #070708 100%);
    color: #e8e6e3;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    font-size: 0.9rem;
    color: #8f8b86;
    max-width: 46ch;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 560px;
    border-radius: 18px;
    overflow: hidden;
    background: #16161a;
    border: 1px solid #26262c;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,.8);
  }
  /* Twitter's iframe renders at 550px wide on desktop */
  .card .twitter-tweet-rendered, .card iframe { width: 100% !important; margin: 0 !important; }
  .card .twitter-tweet { margin: 0 auto; }
  .loading {
    padding: 60px 20px;
    font-size: .85rem;
    color: #6f6b66;
    letter-spacing: .02em;
  }
  footer {
    font-size: .78rem;
    color: #6c6863;
  }
  footer a { color: #a9a49e; text-decoration: none; border-bottom: 1px solid #3a3a42; }
  footer a:hover { color: #fff; border-color: #fff; }
</style>
</head>
<body>
  <header>
    <h1>the dough video</h1>
    <p>Guy, dough, commercial kitchen, and a slow-mo edit that fights the fast-forward.</p>
  </header>

  <div class="card" id="embed">
    <div class="loading" id="loading">loading the post…</div>
    <blockquote class="twitter-tweet" data-theme="dark" data-dnt="true" data-conversation="none">
      <a href="https://x.com/boof_cart/status/1998203686808629523">Found it lmao</a>
    </blockquote>
  </div>

  <footer>
    posted by <a href="https://x.com/boof_cart">@boof_cart</a> · original by
    <a href="https://www.tiktok.com/@outbackrak">@outbackrak</a>
  </footer>

  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script>
    (function () {
      var loading = document.getElementById('loading');
      var done = false;
      function hide() { if (!done) { done = true; loading.style.display = 'none'; } }
      // widgets.js replaces the blockquote with an iframe; watch for it
      new MutationObserver(function () {
        if (document.querySelector('#embed iframe')) hide();
      }).observe(document.getElementById('embed'), { childList: true, subtree: true });
      // if the widget cannot load (blocked/offline), show the link instead
      setTimeout(function () {
        if (!document.querySelector('#embed iframe')) {
          loading.innerHTML = 'Embed blocked — <a href="https://x.com/boof_cart/status/1998203686808629523" style="color:#a9a49e">open the post on X</a>';
        }
      }, 8000);
    })();
  </script>
</body>
</html>
