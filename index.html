<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- deploy probe 1 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: safe center;
    justify-content: center;
    padding: 18px;
    background: #0b0b0d;
  }
  /* Twitter renders its iframe at 550px; let it shrink on phones */
  .embed { width: 100%; max-width: 550px; }
  .embed .twitter-tweet-rendered,
  .embed iframe { width: 100% !important; margin: 0 !important; }
  .embed .twitter-tweet { margin: 0 !important; }
</style>
</head>
<body>
  <div class="embed" id="embed">
    <blockquote class="twitter-tweet" data-theme="dark" data-dnt="true" data-conversation="none">
      <a href="https://x.com/boof_cart/status/1998203686808629523">Found it lmao</a>
    </blockquote>
  </div>

  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script>
    // only if the widget cannot load at all: swap in a plain link instead of an empty page
    setTimeout(function () {
      var box = document.getElementById('embed');
      if (!box.querySelector('iframe') && !box.querySelector('.twitter-tweet-rendered')) {
        box.innerHTML = '<a href="https://x.com/boof_cart/status/1998203686808629523" '
          + 'style="color:#8f8b86;font:14px system-ui,sans-serif;text-decoration:none">open the post on X</a>';
      }
    }, 8000);
  </script>
</body>
</html>
